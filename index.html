```html
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ma Pointeuse</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 30px;
    font-family: Arial, sans-serif;
    background: #f4f5f7;
    color: #20242a;
}

.container {
    max-width: 600px;
    margin: auto;
}

.card {
    background: white;
    padding: 30px;
    border-radius: 20px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.1);
}

h1 {
    text-align: center;
}

#clock {
    text-align: center;
    font-size: 55px;
    font-weight: bold;
    margin: 30px 0;
}

#status {
    text-align: center;
    margin-bottom: 25px;
    font-size: 18px;
}

.buttons {
    display: flex;
    flex-direction: column;
    gap: 12px;
}

button {
    width: 100%;
    padding: 18px;
    border: none;
    border-radius: 12px;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
}

#start {
    background: #20242a;
    color: white;
}

#pause {
    background: #ddd;
}

#resume {
    background: #20242a;
    color: white;
}

#stop {
    background: #d9534f;
    color: white;
}

button:disabled {
    opacity: 0.35;
    cursor: not-allowed;
}

#message {
    text-align: center;
    margin-top: 25px;
    color: #666;
}

</style>
</head>


<body>

<div class="container">

<div class="card">

<h1>Ma Pointeuse</h1>

<div id="clock">
00:00:00
</div>

<div id="status">
Journée non commencée
</div>


<div class="buttons">

<button id="start">
▶️ Arrivée
</button>

<button id="pause" disabled>
⏸️ Pause
</button>

<button id="resume" disabled>
▶️ Reprendre
</button>

<button id="stop" disabled>
⏹️ Départ
</button>

</div>


<div id="message">
Clique sur « Arrivée » pour commencer.
</div>

</div>

</div>


<script>

let startTime = null;

let pauseStart = null;

let totalPause = 0;

let timer = null;

let state = "idle";


const clock =
document.getElementById("clock");

const status =
document.getElementById("status");

const message =
document.getElementById("message");

const startButton =
document.getElementById("start");

const pauseButton =
document.getElementById("pause");

const resumeButton =
document.getElementById("resume");

const stopButton =
document.getElementById("stop");


function formatTime(milliseconds) {

    let totalSeconds =
        Math.floor(milliseconds / 1000);

    let hours =
        Math.floor(totalSeconds / 3600);

    let minutes =
        Math.floor((totalSeconds % 3600) / 60);

    let seconds =
        totalSeconds % 60;


    return String(hours).padStart(2,"0")
        + ":"
        + String(minutes).padStart(2,"0")
        + ":"
        + String(seconds).padStart(2,"0");
}


function updateClock() {

    if (!startTime) {
        return;
    }


    let now = Date.now();

    let pause = totalPause;


    if (state === "paused") {

        pause +=
            now - pauseStart;

    }


    let worked =
        now - startTime - pause;


    clock.textContent =
        formatTime(worked);
}


startButton.addEventListener(
    "click",
    function() {

        startTime = Date.now();

        totalPause = 0;

        state = "working";

        startButton.disabled = true;

        pauseButton.disabled = false;

        resumeButton.disabled = true;

        stopButton.disabled = false;

        status.textContent =
            "🟢 Journée en cours";

        message.textContent =
            "La journée a commencé.";

        timer =
            setInterval(updateClock, 1000);

        updateClock();

    }
);


pauseButton.addEventListener(
    "click",
    function() {

        if (state !== "working") {
            return;
        }

        pauseStart = Date.now();

        state = "paused";

        pauseButton.disabled = true;

        resumeButton.disabled = false;

        status.textContent =
            "🟠 En pause";

        message.textContent =
            "Le temps de pause n'est pas comptabilisé.";

    }
);


resumeButton.addEventListener(
    "click",
    function() {

        if (state !== "paused") {
            return;
        }

        totalPause +=
            Date.now() - pauseStart;

        pauseStart = null;

        state = "working";

        pauseButton.disabled = false;

        resumeButton.disabled = true;

        status.textContent =
            "🟢 Journée en cours";

        message.textContent =
            "Le travail a repris.";

    }
);


stopButton.addEventListener(
    "click",
    function() {

        if (
            state !== "working" &&
            state !== "paused"
        ) {
            return;
        }


        let now = Date.now();


        if (state === "paused") {

            totalPause +=
                now - pauseStart;

        }


        let worked =
            now - startTime - totalPause;


        clearInterval(timer);

        state = "finished";


        clock.textContent =
            formatTime(worked);


        startButton.disabled = true;

        pauseButton.disabled = true;

        resumeButton.disabled = true;

        stopButton.disabled = true;


        status.textContent =
            "🔴 Journée terminée";

        message.textContent =
            "Temps travaillé : "
            + formatTime(worked);

    }
);

</script>

</body>
</html>
```
